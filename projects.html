<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Projects by Emma Hagelin loaded from GitHub." />
    <title>Projects - Emma Hagelin</title>
    <link rel="icon" href="images/sparkle.png" type="image/png" />

    <!-- Picks light or dark theme -->
    <script src="js/theme-init.js"></script>

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="CSS/projects.css" />
    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Header/Navigation -->
     <header class="site-header">
        <nav class="nav" aria-label="Main Navigation">
            <a href="index.html" class="logo">Emma<span>.</span></a>

            <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="nav-links">
                <span class="menu-toggle__bar"></span>
                <span class="visually-hidden">Menu</span>
            </button>

            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="tech-stack.html">Tech Stack</a></li> 
                <li><a href="projects.html" aria-current="page">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode">
                <!-- Moon icon for dark mode -->
                 <svg class="icon icon-moon" viewbox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                 </svg>

                 <!-- Sun icon for light mode -->
                    <svg class="icon icon-sun" viewbox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                    </svg>
            </button>
        </nav>
     </header>

     <main id="main" class="section">
        <p class="section-eyebrow reveal">selected work</p>
        <h1 class="section-title reveal">Projects</h1>

        <!-- Filter buttons are created by script.js when the projects have loaded -->
         <div class="project-filters" id="project-filters" role="group" aria-label="Filter projects by language" hidden></div>
         <p class="visually-hidden" id="filter-result" role="status"></p>

         <!-- loading/error/empty message appears -->
          <div class="status-box" id="project-status" role="status"></div>

          <!-- Filled from the GitHub API by script.js -->
        <ul class="project-grid" id="project-list"></ul>
     </main>

     <!-- Footer -->

      <footer class="site-footer">
        <p>
            Made with <span class="love">Love &amp; Late Nights</span> by
            <span class="footer-name">Emma Hagelin</span> © <span id="year">2026</span>
        </p>
      </footer>

  </body>
</html>
